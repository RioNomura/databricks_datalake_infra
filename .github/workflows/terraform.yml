name: terraform

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"
      - "scripts/notion_sync.py"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - "scripts/notion_sync.py"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

# apply が同時に走らないようにする
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: envs/prod

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # provider のダウンロード元（GitHub / Terraform Registry）が一時的に落ちることがあるため、最大 3 回試す
      - name: terraform init
        run: |
          for attempt in 1 2 3; do
            terraform init -input=false && exit 0
            echo "terraform init が失敗しました（${attempt} 回目）。20 秒後に再試行します"
            sleep 20
          done
          exit 1

      - name: terraform validate
        run: terraform validate -no-color

      # plan の結果は tfcmt が PR にコメントする（タイトル「Plan Result (envs/prod)」、要約・種類ごとのリソース一覧・折りたたみの詳細）
      # -patch で同じ PR の前回コメントを上書きし、push のたびにコメントが増えないようにする
      - uses: shmokmt/actions-setup-tfcmt@v2
        with:
          version: v4.6.0

      - name: terraform plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tfcmt -var target:envs/prod plan -patch -- \
            terraform plan -input=false -no-color -out=tfplan

      - name: Notion 同期のプレビュー
        run: |
          terraform show -json tfplan > plan.json
          echo '{}' > state.json
          python3 "$GITHUB_WORKSPACE/scripts/notion_sync.py" --plan plan.json --state state.json --dry-run

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # provider のダウンロード元（GitHub / Terraform Registry）が一時的に落ちることがあるため、最大 3 回試す
      - name: terraform init
        run: |
          for attempt in 1 2 3; do
            terraform init -input=false && exit 0
            echo "terraform init が失敗しました（${attempt} 回目）。20 秒後に再試行します"
            sleep 20
          done
          exit 1

      - name: terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      # apply の結果も tfcmt がマージ元の PR にコメントする（タイトル「Apply Result (envs/prod)」）
      - uses: shmokmt/actions-setup-tfcmt@v2
        with:
          version: v4.6.0

      - name: terraform apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          terraform show -json tfplan > plan.json
          # マージコミットから元の PR 番号を調べて tfcmt に渡す。
          # tfcmt 任せだと PR が見つからなかったときにコミットへのコメントになり、
          # contents: read では書けずに何も残らない（エラーも出ない）ため
          pr=""
          for attempt in 1 2 3; do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty' || true)
            [ -n "$pr" ] && break
            sleep 5
          done
          echo "コメント先の PR: ${pr:-見つからず}"
          tfcmt ${pr:+-pr "$pr"} -var target:envs/prod apply -- \
            terraform apply -input=false -no-color tfplan

      - name: Notion のリソース台帳を更新
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          terraform show -json > state.json
          python3 "$GITHUB_WORKSPACE/scripts/notion_sync.py" --plan plan.json --state state.json
